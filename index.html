<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La fe que se arremanga - Invitación Digital</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        /* Fuentes Personalizadas */
        :root {
            font-family: 'Inter', sans-serif;
        }

        .font-main {
            font-family: 'Cinzel', serif;
        }

        .font-literary {
            font-family: 'Playfair Display', serif;
        }

        /* Clase para evitar scroll en el body cuando un modal está abierto */
        .modal-open {
            overflow: hidden;
        }

        /* Animaciones suaves */
        /* Animaciones Celestiales */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes shine {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }

        .shine-text {
            background: linear-gradient(90deg, #fbbf24 0%, #ffffff 50%, #fbbf24 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 8s linear infinite;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* RADIANT HEXAGON & PORTAL EFFECTS */
        .hex-alt {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }

        .portal-glow {
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.3), inset 0 0 40px rgba(244, 63, 94, 0.3);
        }

        /* Disruptive Shapes */
        .shape-diamond-container {
            transform: rotate(45deg);
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(251, 191, 36, 0.2);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shape-diamond-container:hover {
            transform: rotate(45deg) scale(1.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(251, 191, 36, 0.4);
        }

        .shape-diamond-img {
            transform: rotate(-45deg) scale(1.45);
            /* Counter-rotate & scale to fill corners */
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shape-diamond-container:hover .shape-diamond-img {
            transform: rotate(-45deg) scale(1.55);
        }
    </style>
    <script>
        // Configuración y variables globales
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        // ENLACE DE LA GUÍA (Actualizado)
        const GUIDE_URL = "https://innovacion-con-clase.github.io/Dios-invita/";
        const MEET_URL = "https://meet.google.com/rsj-mbap-jpi";

        // Estado central
        let state = {
            openCover: false,
            openGuide: false,
            openRSVP: false,
            rsvpName: "",
            rsvpEmail: "",
            rsvpSent: false,
            sending: false,
            joinModalOpen: false,
            rsvpServerResponse: null,
            lastError: null,
            messageModal: null,
            // FECHA ACTUALIZADA: 25 de enero de 2026, 11:00 AM
            eventDate: new Date("2026-01-25T11:00:00-05:00"),
            now: new Date(),
        };

        // Función para actualizar y renderizar
        function updateState(newState) {
            state = { ...state, ...newState };
            render();
            const open = state.openGuide || state.openRSVP || state.joinModalOpen || state.messageModal;
            document.body.classList.toggle('modal-open', open);
        }

        // --- Lógica del Reloj ---
        function calculateCountdown() {
            const timeDiff = state.eventDate - state.now;
            const canJoin = timeDiff <= 5 * 60 * 1000 && timeDiff > -2 * 60 * 60 * 1000;

            const days = Math.max(0, Math.floor(timeDiff / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const minutes = Math.max(0, Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60)));
            const seconds = Math.max(0, Math.floor((timeDiff % (1000 * 60)) / 1000));

            let countdownText = "";
            if (timeDiff > 0) {
                if (days > 0) countdownText += `${days}d `;
                countdownText += `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            } else if (timeDiff > -2 * 60 * 60 * 1000) {
                countdownText = "¡EN VIVO!";
            } else {
                countdownText = "Finalizado";
            }

            return { canJoin, countdownText };
        }

        let lastCanJoin = null;

        function tick() {
            state.now = new Date();
            const { canJoin, countdownText } = calculateCountdown();

            // Direct DOM update for countdown to avoid full re-render
            const countdownEl = document.getElementById('countdown');
            if (countdownEl) {
                countdownEl.textContent = countdownText;
            }

            // Only trigger full re-render if 'canJoin' status changes
            if (lastCanJoin === null) {
                lastCanJoin = canJoin;
            } else if (canJoin !== lastCanJoin) {
                lastCanJoin = canJoin;
                updateState({}); // Trigger re-render to update UI for Join button
            }
        }

        // --- Utilidad ---
        function isValidEmail(email) {
            return typeof email === "string" && email.includes("@") && email.includes(".") && email.length > 5;
        }

        function closeAllModals() {
            updateState({
                openGuide: false,
                openRSVP: false,
                joinModalOpen: false,
                messageModal: null
            });
        }

        // --- Actions ---
        function handleJoinClick(e) {
            const { canJoin } = calculateCountdown();
            if (!canJoin) {
                updateState({ joinModalOpen: true });
            } else {
                window.open(MEET_URL, "_blank", "noopener,noreferrer");
            }
        }

        async function submitRsvp(e) {
            e.preventDefault();
            updateState({ lastError: null, rsvpServerResponse: null });

            const name = state.rsvpName.trim();
            const email = state.rsvpEmail.trim();

            if (!name) {
                updateState({ messageModal: { title: "Falta Nombre", message: "Por favor ingresa tu nombre completo.", type: "error" } });
                return;
            }
            if (!isValidEmail(email)) {
                updateState({ messageModal: { title: "Correo Inválido", message: "Por favor ingresa un correo válido.", type: "error" } });
                return;
            }

            updateState({ sending: true });

            const payloadObj = {
                name: name,
                email: email,
                timestamp: new Date().toISOString(),
                source: "InvitacionWeb-ElRadarDelCielo",
            };

            try {
                if (SHEET_ENDPOINT && SHEET_ENDPOINT.startsWith('http')) {
                    const params = new URLSearchParams();
                    Object.keys(payloadObj).forEach((k) => params.append(k, payloadObj[k]));

                    const res = await fetch(SHEET_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString(),
                    });

                    const text = await res.text();
                    let json = null;
                    try { json = JSON.parse(text); } catch (err) { }

                    if (!res.ok) {
                        throw new Error(`Error ${res.status} - ${text}`);
                    }

                    updateState({
                        rsvpServerResponse: { ok: true, status: res.status, body: json || text },
                        rsvpSent: true,
                        rsvpName: "",
                        rsvpEmail: "",
                        messageModal: { title: "¡Inscripción Recibida!", message: "Tu asistencia ha sido confirmada.", type: "success" }
                    });
                    setTimeout(() => updateState({ openRSVP: false }), 2500);

                } else {
                    // Simulación
                    console.warn('Simulando envío:', payloadObj);
                    updateState({
                        rsvpServerResponse: { ok: true, simulated: true },
                        rsvpSent: true,
                        rsvpName: "",
                        rsvpEmail: "",
                        messageModal: { title: "¡Simulación Exitosa!", message: "Envío simulado correctamente.", type: "success" }
                    });
                    setTimeout(() => updateState({ openRSVP: false }), 2500);
                }
            } catch (err) {
                console.error('Error:', err);
                updateState({
                    lastError: err.message,
                    messageModal: { title: "Error", message: "No se pudo enviar la inscripción. Intenta de nuevo.", type: "error" }
                });
            } finally {
                updateState({ sending: false });
            }
        }

        // --- Render Functions ---

        function renderMessageModal() {
            if (!state.messageModal) return '';
            const { title, message, type } = state.messageModal;
            const bgColor = type === "error" ? "bg-rose-600" : "bg-emerald-600";

            return `
                <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="updateState({ messageModal: null })"></div>
                    <div class="relative w-full max-w-sm rounded-2xl p-6 shadow-2xl z-20 ${bgColor} text-white border border-white/10 font-literary">
                        <h4 class="text-2xl font-bold font-main mb-2">${title}</h4>
                        <p class="text-white/90 mb-6 font-serif text-lg leading-relaxed">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="updateState({ messageModal: null })" class="px-6 py-2 rounded-full bg-white text-slate-900 font-main font-bold hover:bg-amber-100 transition shadow-lg">
                                Entendido
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderJoinModal() {
            if (!state.joinModalOpen) return '';
            return `
                <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="updateState({ joinModalOpen: false })"></div>
                    <div class="relative bg-[#0F172A] border border-amber-500/30 rounded-2xl p-8 shadow-2xl max-w-md w-full z-10 text-center relative overflow-hidden">
                        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent"></div>
                        
                        <div class="w-20 h-20 rounded-full bg-amber-500/10 flex items-center justify-center mx-auto mb-6 border border-amber-500/20 animate-float">
                            <svg class="w-10 h-10 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                        </div>
                        <h4 class="text-3xl font-bold text-amber-100 font-main mb-3">La hora es Sagrada</h4>
                        <p class="text-slate-300 mb-8 leading-relaxed font-literary text-lg">
                            El orden comienza en el tiempo preciso.<br>
                            La transmisión inicia **5 minutos antes** de las 11:00 a.m.
                        </p>
                        <button onclick="updateState({ joinModalOpen: false })" class="px-8 py-3 rounded-full bg-gradient-to-r from-amber-600 to-amber-800 text-white font-bold font-main tracking-widest hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] transition w-full uppercase text-sm">Entendido</button>
                    </div>
                </div>
            `;
        }

        function renderGuideModal() {
            if (!state.openGuide) return '';
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="updateState({ openGuide: false })"></div>
                    <div class="relative w-full max-w-lg bg-[#0F172A] border border-amber-500/20 rounded-2xl p-8 shadow-2xl z-10 overflow-hidden">
                         <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl"></div>
                        <h3 class="text-3xl font-bold text-white font-main mb-2 text-center">La Mesa está Servida</h3>
                        <p class="text-slate-400 mb-8 text-center font-literary italic">"Dime qué comes y te diré quién eres"</p>
                        
                        <a href="${GUIDE_URL}" target="_blank" onclick="updateState({ openGuide: false })"
                            class="group relative block w-full py-5 rounded-lg bg-slate-800 border border-amber-500/30 text-amber-100 text-center font-main uppercase tracking-widest font-bold hover:bg-slate-700 hover:border-amber-400 transition mb-4 overflow-hidden">
                            <div class="absolute inset-0 w-0 bg-amber-500/10 transition-all duration-500 group-hover:w-full"></div>
                            <span class="relative flex items-center justify-center gap-3">
                                <span>Explorar la Guía</span>
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </span>
                        </a>
                        <button onclick="updateState({ openGuide: false })" class="w-full py-2 text-slate-500 hover:text-amber-200 transition font-main text-xs tracking-[0.2em] uppercase">Cerrar</button>
                    </div>
                </div>
            `;
        }

        function renderRSVPModal() {
            if (!state.openRSVP) return '';
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="updateState({ openRSVP: false })"></div>
                    <form onsubmit="submitRsvp(event)" class="relative w-full max-w-sm bg-[#0F172A] border border-amber-500/20 rounded-2xl p-8 shadow-2xl z-10">
                        <h3 class="text-2xl font-bold text-white font-main mb-2 text-center">Reserva tu Lugar</h3>
                        <p class="text-sm text-amber-400/80 mb-8 text-center font-literary italic">"Venid, que ya todo está preparado"</p>
                        
                        <div class="space-y-5">
                            <div class="group">
                                <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1 tracking-widest font-main">Nombre</label>
                                <input id="rsvpName" required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value"
                                    class="w-full bg-slate-900/50 border-b border-slate-600 rounded-none p-3 text-amber-100 placeholder-slate-700 focus:border-amber-500 focus:outline-none transition font-literary text-lg" placeholder="Escribe tu nombre...">
                            </div>
                            <div class="group">
                                <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1 tracking-widest font-main">Correo</label>
                                <input id="rsvpEmail" required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                    class="w-full bg-slate-900/50 border-b border-slate-600 rounded-none p-3 text-amber-100 placeholder-slate-700 focus:border-amber-500 focus:outline-none transition font-literary text-lg" placeholder="correo@ejemplo.com">
                            </div>
                        </div>

                        <div class="mt-10 flex gap-4">
                            <button type="submit" ${state.sending ? 'disabled' : ''} class="flex-1 py-3 rounded-lg bg-gradient-to-r from-amber-700 to-amber-900 text-amber-100 font-main font-bold uppercase text-xs tracking-widest hover:from-amber-600 hover:to-amber-800 transition disabled:opacity-50 flex justify-center items-center gap-2 border border-amber-500/20">
                                ${state.sending ? '<div class="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>' : ''}
                                <span>${state.sending ? 'Enviando...' : 'Confirmar'}</span>
                            </button>
                            <button type="button" onclick="updateState({ openRSVP: false })" class="px-6 py-3 rounded-lg border border-slate-700 text-slate-400 font-main text-xs font-bold uppercase tracking-widest hover:text-white hover:border-slate-500 transition">Cancelar</button>
                        </div>
                    </form>
                </div>
            `;
        }

        // --- Main Render ---
        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            // Preserve Focus Logic (Simplified)
            let focusedId = document.activeElement ? document.activeElement.id : null;
            let focusedVal = document.activeElement ? document.activeElement.value : null;

            const { openCover } = state;
            const { canJoin, countdownText } = calculateCountdown();

            let mainContent = '';

            if (!openCover) {
                // COVER
                mainContent = `
                    <div class="text-center p-8 max-w-xl w-full animate-fade-in-up relative">
                        <!-- Decorative Stars -->
                        <div class="absolute top-0 left-10 w-1 h-1 bg-white rounded-full animate-twinkle" style="animation-delay: 0.2s"></div>
                        <div class="absolute top-20 right-20 w-1.5 h-1.5 bg-amber-200 rounded-full animate-twinkle" style="animation-delay: 0.7s"></div>
                        <div class="absolute bottom-10 left-1/4 w-1 h-1 bg-white rounded-full animate-twinkle" style="animation-delay: 1.2s"></div>

                        <!-- NEW RADIANT HEXAGON DESIGN -->
                        <div class="relative mx-auto mb-12 mt-4 w-60 h-64 animate-float group">
                            <!-- Background Pulse Aura -->
                            <div class="absolute inset-0 bg-amber-500/20 blur-[50px] rounded-full animate-pulse"></div>
                            
                            <!-- Spinning Living Border -->
                            <div class="absolute inset-0 hex-alt bg-gradient-to-tr from-transparent via-amber-400 to-transparent opacity-70 animate-spin-slow bg-[length:200%_200%]"></div>
                            <!-- Counter-spinning Border Layer for complexity -->
                            <div class="absolute inset-1 hex-alt bg-gradient-to-bl from-transparent via-rose-500 to-transparent opacity-70 animate-spin-slow" style="animation-direction: reverse; animation-duration: 12s;"></div>

                            <!-- Inner Frame -->
                            <div class="absolute inset-[3px] hex-alt bg-[#050B14] z-10 flex items-center justify-center p-1 portal-glow">
                                <!-- The Image -->
                                <div class="w-full h-full hex-alt overflow-hidden relative">
                                    <img src="https://i.imgur.com/Fi13RIY.png" class="w-full h-full object-cover transform scale-110 group-hover:scale-125 transition-transform duration-1000" alt="Símbolo">
                                    <!-- Shine Sheen -->
                                    <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/20 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                                </div>
                            </div>
                        </div>
                        
                        <h1 class="text-5xl md:text-7xl font-bold font-main text-transparent bg-clip-text bg-gradient-to-b from-amber-100 to-amber-400 mb-6 drop-shadow-2xl leading-tight">
                            Cuando Dios te sienta<br>a la mesa
                        </h1>
                        
                        <div class="flex items-center justify-center gap-4 mb-12 opacity-80">
                            <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-amber-500/50"></div>
                            <p class="text-xl text-amber-100/90 font-literary italic tracking-wide">Dime qué comes y te diré quién eres</p>
                            <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-amber-500/50"></div>
                        </div>

                        <button onclick="updateState({ openCover: true })"
                            class="group relative px-10 py-4 bg-transparent overflow-hidden rounded-sm transition-all hover:scale-105 border border-amber-500/40">
                            <div class="absolute inset-0 w-full h-full bg-amber-900/20 group-hover:bg-amber-900/40 transition-colors"></div>
                            <div class="absolute bottom-0 left-0 h-[1px] w-full bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>
                            <span class="relative text-amber-200 font-main font-bold tracking-[0.3em] uppercase text-sm group-hover:text-white transition-colors">Descubrir Mensaje</span>
                        </button>
                    </div>
                `;
            } else {
                // INVITATION CARD
                mainContent = `
                    <div class="w-full max-w-5xl animate-fade-in transition-all duration-1000">
                        <div class="glass-panel rounded-lg overflow-hidden shadow-2xl relative border border-white/5 bg-[#0a0a0a]/60 backdrop-blur-xl">
                            <!-- Background Decoration -->
                            <div class="absolute -top-40 -right-40 w-96 h-96 bg-rose-500/10 rounded-full blur-[100px]"></div>
                            <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-amber-500/5 rounded-full blur-[100px]"></div>

                            <div class="grid grid-cols-1 md:grid-cols-12 relative z-10 min-h-[500px]">
                                <!-- Left Column: Visual (4 cols) -->
                                <div class="md:col-span-5 p-10 flex flex-col justify-center items-center text-center relative overflow-hidden group perspective-1000">
                                     <!-- Back Glow -->
                                     <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-amber-500/20 blur-[60px] rounded-full"></div>

                                    <!-- HEXAGON COMPONENT -->
                                    <div class="relative w-56 h-60 animate-float z-10 transition-transform duration-700 group-hover:scale-105">
                                         <!-- Gold Ring Spinner -->
                                        <div class="absolute -inset-1 hex-alt bg-conic-gradient(from 0deg, transparent, #fbbf24, transparent) opacity-80 animate-spin-slow"></div>
                                        
                                        <!-- Image Container -->
                                        <div class="absolute inset-[2px] hex-alt bg-black border border-amber-500/30 overflow-hidden">
                                            <img src="https://i.imgur.com/Fi13RIY.png" alt="Arte" class="w-full h-full object-cover scale-110 filter brightness-90 group-hover:brightness-110 transition-all duration-700">
                                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                                        </div>
                                    </div>

                                    <div class="relative mt-8 w-full flex justify-center">
                                        <div class="w-px h-12 bg-gradient-to-b from-amber-500/0 via-amber-500/50 to-amber-500/0"></div>
                                    </div>
                                </div>

                                <!-- Right Column: Content (7 cols) -->
                                <div class="md:col-span-7 p-8 md:p-14 flex flex-col justify-center bg-gradient-to-l from-black/20 to-transparent relative">
                                    
                                    <div class="mb-10">
                                        <div class="flex items-center gap-3 mb-4">
                                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.8)]"></span>
                                            <span class="text-[10px] font-main font-bold text-amber-400/80 uppercase tracking-[0.3em]">Evento Exclusivo</span>
                                        </div>
                                        <h2 class="text-4xl md:text-5xl font-bold text-white font-main mb-4 leading-tight">Cuando Dios te sienta<br><span class="shine-text">a la mesa</span></h2>
                                        <p class="text-lg text-slate-300 font-literary italic leading-relaxed border-l-2 border-amber-500/30 pl-5">
                                            Dime qué comes y te diré quién eres
                                        </p>
                                    </div>

                                    <div class="grid grid-cols-2 gap-8 mb-10">
                                        <div>
                                            <p class="text-[10px] uppercase text-slate-500 font-bold mb-1 tracking-widest font-main">Fecha Sagrada</p>
                                            <h3 class="text-4xl font-bold text-white font-title mb-1">25 Enero 2026</h3>
                                            <p class="text-lg text-slate-300">Domingo • 11:00 A.M.</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] uppercase text-slate-500 font-bold mb-1 tracking-widest font-main">Cuenta Regresiva</p>
                                            <p id="countdown" class="text-2xl font-mono text-amber-100/90">${countdownText}</p>
                                        </div>
                                    </div>

                                    <div class="flex flex-col sm:flex-row gap-4">
                                        <button onclick="handleJoinClick(event)" 
                                            class="px-8 py-4 rounded-sm font-main font-bold uppercase text-xs tracking-[0.2em] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3
                                            ${canJoin ? 'bg-amber-600 text-white shadow-[0_10px_30px_rgba(217,119,6,0.2)]' : 'bg-slate-800 text-slate-400 cursor-not-allowed'}">
                                            <span>Ingresar</span>
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                        </button>
                                        
                                        <div class="flex gap-4">
                                            <button onclick="updateState({ openGuide: true })" class="px-6 py-4 rounded-sm border border-slate-700 text-slate-300 font-main font-bold uppercase text-[10px] tracking-[0.2em] hover:border-amber-500/50 hover:text-amber-100 transition">
                                                Guía
                                            </button>
                                            <button onclick="updateState({ openRSVP: true })" class="px-6 py-4 rounded-sm border border-slate-700 text-slate-300 font-main font-bold uppercase text-[10px] tracking-[0.2em] hover:border-amber-500/50 hover:text-white transition">
                                                RSVP
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = `
                <main class="min-h-screen bg-[#020617] relative flex items-center justify-center p-4 selection:bg-amber-500/30 overflow-hidden">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-rose-950/40 via-[#020617] to-[#020617]"></div>
                    ${mainContent}
                </main>
                ${renderJoinModal()}
                ${renderGuideModal()}
                ${renderRSVPModal()}
                ${renderMessageModal()}
            `;

            // Restore focus (basic)
            if (focusedId) {
                const el = document.getElementById(focusedId);
                if (el) {
                    el.value = focusedVal;
                    el.focus();
                }
            }
        }

        window.onload = function () {
            setInterval(tick, 1000);
            tick();
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") { closeAllModals(); if (state.openCover) updateState({ openCover: false }); }
            });
            render();
        };
    </script>
</head>

<body class="bg-[#050B14] text-slate-200 antialiased">
    <div id="app"></div>
</body>

</html>
