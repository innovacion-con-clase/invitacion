<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADN de Rescatista - Invitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* Modern Tech Font Stack */
        :root {
            font-family: 'Inter', sans-serif;
            --color-signal: #f97316;
            /* Orange 500 */
            --color-active: #10b981;
            /* Emerald 500 */
            --color-slate-900: #0f172a;
        }

        .font-mono-tech {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.02em;
        }

        /* Radar animations */
        @keyframes radar-ping {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }

            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        @keyframes scan-line {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .animate-radar {
            animation: radar-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .animate-scan {
            animation: scan-line 3s linear infinite;
        }

        .animate-blink {
            animation: blink 1.5s step-end infinite;
        }

        /* Tech/Glass Panel */
        .tech-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2), 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .tech-border-glow {
            box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.2);
        }

        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .modal-open {
            overflow: hidden;
        }
    </style>
    <script>
        // Configuración
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        const GUIDE_URL = "https://innovacion-con-clase.github.io/ADN-de-Rescatista/";
        const MEET_URL = "https://meet.google.com/rsj-mbap-jpi"; // Assuming same meet link unless changed
        const EVENT_DATE = new Date("2026-02-15T11:00:00-05:00");

        let state = {
            view: 'cover', // cover, card
            modal: null, // null, 'guide', 'rsvp', 'join'
            rsvpName: "",
            rsvpEmail: "",
            sending: false,
            rsvpStatus: null, // null, 'success', 'error'
            now: new Date(),
        };

        function updateState(updates) {
            state = { ...state, ...updates };
            render();
            document.body.classList.toggle('modal-open', !!state.modal);
        }

        // Timer Logic
        function getTimeRemaining() {
            const total = EVENT_DATE - state.now;
            const seconds = Math.floor((total / 1000) % 60);
            const minutes = Math.floor((total / 1000 / 60) % 60);
            const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
            const days = Math.floor(total / (1000 * 60 * 60 * 24));

            const isLive = total <= 0 && total > -2 * 60 * 60 * 1000;
            const isEnded = total <= -2 * 60 * 60 * 1000;

            return { total, days, hours, minutes, seconds, isLive, isEnded };
        }

        function tick() {
            state.now = new Date();
            const { total, isLive } = getTimeRemaining();

            // Only re-render if we cross into "Live" or every second for countdown text
            // Optimization: updading text content directly if exists
            const el = document.getElementById('countdown-display');
            if (el) {
                const t = getTimeRemaining();
                if (t.isLive) el.innerText = "TRANSIMISIÓN EN VIVO";
                else if (t.isEnded) el.innerText = "FINALIZADO";
                else {
                    let text = `T-`;
                    if (t.days > 0) text += `${t.days}d `;
                    text += `${String(t.hours).padStart(2, '0')}h ${String(t.minutes).padStart(2, '0')}m ${String(t.seconds).padStart(2, '0')}s`;
                    el.innerText = text;
                }
            }

            // Check if we need to update "Join" button state
            const joinBtn = document.getElementById('btn-join');
            if (joinBtn) {
                const canJoin = total <= 5 * 60 * 1000 && !isLive && !isEnded; // 5 mins before
                if (isLive || canJoin) {
                    joinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    joinBtn.classList.add('animate-pulse');
                }
            }
        }

        // Actions
        async function handleRSVP(e) {
            e.preventDefault();
            if (!state.rsvpName || !state.rsvpEmail.includes('@')) {
                alert("Por favor verifica tus datos.");
                return;
            }

            updateState({ sending: true });

            try {
                // Construct Payload
                const formData = new URLSearchParams();
                formData.append('name', state.rsvpName);
                formData.append('email', state.rsvpEmail);
                formData.append('timestamp', new Date().toISOString());
                formData.append('source', 'ADNRescatistaWeb');

                // Send
                await fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                updateState({ sending: false, rsvpStatus: 'success', modal: null });
                setTimeout(() => alert("¡Registro confirmado! Nos vemos en la señal."), 500);

            } catch (err) {
                console.error(err);
                updateState({ sending: false, rsvpStatus: 'error' });
                alert("Error de conexión. Inténtalo de nuevo.");
            }
        }

        function handleJoin() {
            const { total } = getTimeRemaining();
            // Allow join 15 mins before
            if (total > 15 * 60 * 1000) {
                alert("La señal aún no está activa. Regresa 15 minutos antes.");
                return;
            }
            window.open(MEET_URL, '_blank');
        }

        // Render Components

        function RenderCover() {
            return `
                <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 animate-fade-in">
                    <!-- Signal Icon / Radar -->
                    <div class="relative w-32 h-32 mb-8 group cursor-pointer" onclick="updateState({view: 'card'})">
                        <div class="absolute inset-0 bg-orange-500/20 rounded-full animate-radar"></div>
                        <div class="absolute inset-0 bg-orange-500/10 rounded-full animate-radar" style="animation-delay: 0.5s"></div>
                        <div class="relative w-full h-full bg-slate-900 border border-orange-500/50 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(249,115,22,0.3)] group-hover:scale-105 transition-transform duration-300">
                            <svg class="w-12 h-12 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                    </div>

                    <div class="space-y-2 mb-8">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/10 border border-orange-500/20 text-orange-400 text-xs font-mono-tech tracking-wider uppercase">
                            <span class="w-2 h-2 rounded-full bg-orange-500 animate-blink"></span>
                            Señal Entrante
                        </div>
                        <h1 class="text-5xl md:text-7xl font-bold font-mono-tech text-white tracking-tighter leading-tight">
                            ADN DE<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">RESCATISTA</span>
                        </h1>
                        <p class="text-slate-400 text-lg md:text-xl max-w-lg mx-auto leading-relaxed">
                            "Forjando el Carácter del Pastor: El ADN que Transforma y Rescata"
                        </p>
                    </div>

                    <button onclick="updateState({view: 'card'})" class="group relative px-8 py-3 bg-white text-slate-900 font-bold font-mono-tech uppercase tracking-widest text-sm hover:bg-orange-500 hover:text-white transition-colors duration-300">
                        <div class="absolute inset-0 border border-white/20 translate-x-1 translate-y-1 group-hover:translate-x-0 group-hover:translate-y-0 transition-transform"></div>
                        <span class="relative">Establecer Conexión</span>
                    </button>
                    
                    <div class="absolute bottom-8 text-xs font-mono-tech text-slate-600 uppercase tracking-widest">
                        Frecuencia Segura /// 15.02.2026
                    </div>
                </div>
            `;
        }

        function RenderCard() {
            const t = getTimeRemaining();

            return `
                <div class="w-full max-w-6xl min-h-[600px] flex items-center justify-center p-4 md:p-8 animate-fade-in-up">
                    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-0 tech-panel rounded-2xl overflow-hidden relative">
                        <!-- Left: Visual/Data -->
                        <div class="lg:col-span-5 relative bg-slate-900/50 p-8 flex flex-col justify-between min-h-[400px] overflow-hidden group">
                            <!-- Background Image with Overlay -->
                            <div class="absolute inset-0 opacity-40 mix-blend-overlay">
                                <img src="https://i.imgur.com/kLMyyBR.jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700 scale-105 group-hover:scale-100" />
                            </div>
                            <!-- Scanline -->
                            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-orange-500/10 to-transparent h-[20%] animate-scan pointer-events-none"></div>

                            <div class="relative z-10">
                                <div class="inline-block border-l-2 border-orange-500 pl-3">
                                    <h3 class="text-orange-500 font-mono-tech text-xs font-bold tracking-widest uppercase mb-1">Proyecto</h3>
                                    <p class="text-white font-bold text-xl tracking-tight">RADAR DEL CIELO</p>
                                </div>
                            </div>

                            <div class="relative z-10 mt-auto">
                                <div class="p-4 bg-slate-950/80 border border-white/10 backdrop-blur-md">
                                    <div class="flex justify-between items-end mb-2">
                                        <span class="text-slate-400 text-xs font-mono-tech uppercase">Tiempo Restante</span>
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    </div>
                                    <div id="countdown-display" class="text-3xl font-mono-tech font-bold text-white tracking-tight tabular-nums">
                                        Calculando...
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Details -->
                        <div class="lg:col-span-7 p-8 md:p-12 flex flex-col relative">
                            <!-- Header -->
                            <div class="mb-10">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="h-[1px] w-8 bg-orange-500"></div>
                                    <span class="text-orange-500 font-mono-tech font-bold text-xs uppercase tracking-[0.2em]">Prioridad Alta</span>
                                </div>
                                <h2 class="text-4xl font-bold text-white font-mono-tech mb-4 leading-none">
                                    ADN DE<br>RESCATISTA
                                </h2>
                                <p class="text-slate-300 leading-relaxed border-l border-slate-700 pl-4 py-1">
                                    Únete a esta transmisión especial. Un espacio para reconectar con el carácter del pastor y recibir nuevas coordenadas ministeriales. <br>
                                    <span class="text-orange-400 block mt-2 font-medium">"El ADN que Transforma y Rescata"</span>
                                </p>
                            </div>

                            <!-- Info Grid -->
                            <div class="grid grid-cols-2 gap-8 mb-10 border-t border-b border-slate-800 py-6">
                                <div>
                                    <h4 class="text-slate-500 font-mono-tech text-xs uppercase tracking-wider mb-2">Fecha</h4>
                                    <p class="text-white font-bold text-lg">15.02.2026</p>
                                    <p class="text-slate-400 text-sm">Domingo</p>
                                </div>
                                <div>
                                    <h4 class="text-slate-500 font-mono-tech text-xs uppercase tracking-wider mb-2">Hora</h4>
                                    <p class="text-white font-bold text-lg">11:00 AM</p>
                                    <p class="text-slate-400 text-sm">Hora Local</p>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                                <button onclick="handleJoin()" id="btn-join" class="py-4 bg-orange-600 hover:bg-orange-500 text-white font-bold font-mono-tech uppercase tracking-wider text-sm transition-colors flex items-center justify-center gap-2 opacity-80">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                    Ingresar
                                </button>
                                <div class="flex gap-2">
                                    <button onclick="updateState({modal:'rsvp'})" class="flex-1 py-4 border border-slate-700 hover:border-white text-slate-300 hover:text-white font-bold font-mono-tech uppercase tracking-wider text-sm transition-colors">
                                        RSVP
                                    </button>
                                    <button onclick="window.open(GUIDE_URL, '_blank')" class="flex-1 py-4 border border-slate-700 hover:border-white text-slate-300 hover:text-white font-bold font-mono-tech uppercase tracking-wider text-sm transition-colors">
                                        Guía
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="updateState({view:'cover'})" class="absolute top-4 right-4 text-slate-600 hover:text-white transition-colors">
                         <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
             `;
        }

        function RenderModal() {
            if (!state.modal) return '';

            // Only RSVP modal logic needed really, Guide is external link, Join is action
            if (state.modal === 'rsvp') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                        <div class="w-full max-w-md bg-slate-900 border border-slate-700 p-8 shadow-2xl relative">
                            <button onclick="updateState({modal:null})" class="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                            
                            <h3 class="text-2xl text-white font-mono-tech font-bold mb-6">Confirmar Asistencia</h3>
                            
                            <form onsubmit="handleRSVP(event)" class="space-y-6">
                                <div>
                                    <label class="block text-slate-400 text-xs font-mono-tech uppercase tracking-wider mb-2">Nombre Completo</label>
                                    <input required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value" 
                                        class="w-full bg-slate-800 border border-slate-700 p-3 text-white focus:border-orange-500 focus:outline-none transition-colors" placeholder="Tu nombre...">
                                </div>
                                <div>
                                    <label class="block text-slate-400 text-xs font-mono-tech uppercase tracking-wider mb-2">Correo Electrónico</label>
                                    <input required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                        class="w-full bg-slate-800 border border-slate-700 p-3 text-white focus:border-orange-500 focus:outline-none transition-colors" placeholder="correo@ejemplo.com">
                                </div>
                                
                                <button type="submit" disabled="${state.sending}" class="w-full py-3 bg-white text-slate-900 font-bold font-mono-tech uppercase tracking-widest hover:bg-orange-500 hover:text-white transition-colors disabled:opacity-50">
                                    ${state.sending ? 'Enviando...' : 'Confirmar'}
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (state.view === 'cover') content = RenderCover();
            else if (state.view === 'card') content = RenderCard();

            app.innerHTML = content + RenderModal();
        }

        // Init
        window.onload = () => {
            render();
            setInterval(tick, 1000);
            tick();
        };

    </script>
</head>

<body
    class="bg-slate-950 text-slate-200 antialiased min-h-screen relative overflow-x-hidden selection:bg-orange-500 selection:text-white">
    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none bg-grid-pattern opacity-20"></div>
    <div
        class="fixed top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_50%_0%,rgba(15,23,42,0),rgba(15,23,42,1))] pointer-events-none">
    </div>

    <div id="app" class="relative z-10 w-full min-h-screen flex flex-col justify-center"></div>
</body>

</html>
