    <!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenemos que Hablar - Invitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            font-family: 'Inter', sans-serif;
            --color-accent: #059669; /* emerald */
            --color-accent-dark: #064e3b;
            --color-purple: #581c87;
            --color-deep: #0f172a;
            --color-paper: #f8f5f2;
        }

        .font-serif-elegant {
            font-family: 'Cormorant Garamond', serif;
        }

        .font-ethereal {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.01em;
        }

        .font-mono-tech {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Ethereal animations */
        @keyframes sun-glow {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes radar-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .animate-radar::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px solid var(--color-accent);
            border-radius: 50%;
            animation: radar-pulse 4s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .animate-sun {
            animation: sun-glow 10s ease-in-out infinite;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow-pulse 4s ease-in-out infinite;
        }

        /* Glass / Fog Panel */
        .fog-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 211, 238, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Background Pattern */
        .bg-ethereal-pattern {
            background-color: #020617;
            background-image: linear-gradient(to bottom, rgba(88, 28, 135, 0.4), rgba(2, 6, 23, 0.9)), url('https://i.imgur.com/9oYJzms.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .light-ray {
            position: absolute;
            background: linear-gradient(to bottom, rgba(251, 191, 36, 0.2), transparent);
            width: 2px;
            pointer-events: none;
        }
    </style>
    <script>
        // Configuración
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        const GUIDE_URL = "https://innovacion-con-clase.github.io/que-se-te-note/";
        const MEET_URL = "https://meet.google.com/jbz-swdo-rpz";
        const EVENT_DATE = new Date("2026-04-26T11:00:00-05:00");

        let state = {
            view: 'cover',
            modal: null,
            rsvpName: "",
            rsvpEmail: "",
            sending: false,
            rsvpStatus: null,
            now: new Date(),
        };

        function updateState(updates) {
            state = { ...state, ...updates };
            render();
            document.body.classList.toggle('modal-open', !!state.modal);
        }

        function getTimeRemaining() {
            const total = EVENT_DATE - state.now;
            const seconds = Math.floor((total / 1000) % 60);
            const minutes = Math.floor((total / 1000 / 60) % 60);
            const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
            const days = Math.floor(total / (1000 * 60 * 60 * 24));

            const isLive = total <= 0 && total > -2 * 60 * 60 * 1000;
            const isEnded = total <= -2 * 60 * 60 * 1000;

            return { total, days, hours, minutes, seconds, isLive, isEnded };
        }

        function tick() {
            state.now = new Date();
            const el = document.getElementById('countdown-display');
            if (el) {
                const t = getTimeRemaining();
                if (t.isLive) el.innerText = "EN VIVO";
                else if (t.isEnded) el.innerText = "EVENTO FINALIZADO";
                else {
                    let text = ``;
                    if (t.days > 0) text += `${t.days}d `;
                    text += `${String(t.hours).padStart(2, '0')}:${String(t.minutes).padStart(2, '0')}:${String(t.seconds).padStart(2, '0')}`;
                    el.innerText = text;
                }
            }
        }

        async function handleRSVP(e) {
            e.preventDefault();
            if (!state.rsvpName || !state.rsvpEmail.includes('@')) {
                alert("Por favor verifica tus datos.");
                return;
            }

            updateState({ sending: true });

            try {
                const formData = new URLSearchParams();
                formData.append('name', state.rsvpName);
                formData.append('email', state.rsvpEmail);
                formData.append('timestamp', new Date().toISOString());
                formData.append('source', 'BiografiaDelHumoWeb');

                await fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                updateState({ sending: false, rsvpStatus: 'success', modal: null });
                setTimeout(() => alert("¡Confirmado! Te esperamos."), 500);

            } catch (err) {
                console.error(err);
                updateState({ sending: false, rsvpStatus: 'error' });
                alert("Hubo un problema. Intenta nuevamente.");
            }
        }

        function handleJoin() {
            const { total } = getTimeRemaining();
            if (total > 15 * 60 * 1000) {
                alert("La señal aún no está lista. Conéctate 15 minutos antes.");
                return;
            }
            window.open(MEET_URL, '_blank');
        }

        function RenderCover() {
            return `
                <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 animate-fade-in overflow-hidden">
                    <div class="absolute inset-0 bg-black/60 z-0"></div>
                    
                    <div class="relative mb-10 animate-float z-10">
                        <div class="w-20 h-20 rounded-full border border-[var(--color-accent)]/30 flex items-center justify-center bg-white/5 backdrop-blur-sm shadow-2xl">
                             <svg class="w-8 h-8 text-[var(--color-accent)] opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l.707.707M6.343 6.343l.707-.707" />
                            </svg>
                        </div>
                        <div class="absolute -inset-4 bg-[var(--color-accent)]/10 rounded-full blur-2xl animate-pulse"></div>
                    </div>

                    <div class="space-y-6 mb-12 relative z-10 w-full max-w-[95%]">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-[var(--color-accent)] text-[10px] md:text-xs font-mono-tech tracking-[0.3em] uppercase">
                            <span class="w-1.5 h-1.5 rounded-full bg-[var(--color-accent)] animate-pulse"></span>
                            EL FRUTO DE TU CARÁCTER
                        </div>
                        <h1 class="text-5xl md:text-8xl font-ethereal font-bold text-white tracking-tighter leading-[0.9] uppercase">
                            QUE SE TE<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-white to-[var(--color-accent)]">NOTE</span>
                        </h1>
                        <p class="text-white/80 text-sm md:text-xl font-serif-elegant italic tracking-wide max-w-lg mx-auto leading-relaxed px-4">
                            "¡Que tus frutos sean tu mejor mensaje!"
                        </p>
                    </div>

                    <button onclick="updateState({view: 'card'})" class="group relative z-10 px-12 py-5 bg-white text-slate-900 font-mono-tech uppercase tracking-[0.2em] text-[10px] overflow-hidden transition-all duration-500 rounded-full shadow-xl hover:scale-105 active:scale-95">
                        <span class="relative font-bold">Abrir Invitación</span>
                    </button>
                    
                    <div class="absolute bottom-10 z-10 text-[9px] font-mono-tech text-white/30 uppercase tracking-[0.4em]">
                        Conversaciones que Transforman
                    </div>
                </div>
            `;
        }

        function RenderCard() {
            const t = getTimeRemaining();

            return `
                <div class="w-full max-w-5xl p-4 md:p-8 animate-fade-in-up flex items-center justify-center min-h-screen">
                    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-0 fog-panel rounded-[2.5rem] md:rounded-3xl overflow-hidden relative border border-white/5 my-4">
                        <!-- Left: Visual -->
                        <div class="lg:col-span-5 relative bg-slate-950 p-0 flex items-center justify-center min-h-[400px] md:min-h-[600px] overflow-hidden group">
                            <!-- Background Blur Layer -->
                            <div class="absolute inset-0 transition-all duration-1000">
                                <img src="https://i.imgur.com/9oYJzms.jpeg" class="w-full h-full object-cover blur-2xl opacity-40 scale-110" />
                                <div class="absolute inset-0 bg-slate-950/40"></div>
                            </div>
                            <!-- Main Image (Contain) -->
                            <div class="relative z-10 w-full h-full flex items-center justify-center p-6">
                                <img src="https://i.imgur.com/9oYJzms.jpeg" class="max-w-full max-h-full object-contain shadow-2xl rounded-2xl transform transition-transform duration-700 group-hover:scale-[1.02]" />
                            </div>
                            
                            <div class="absolute bottom-6 left-6 z-20">
                                <div class="p-4 bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-[var(--color-accent)] text-[9px] font-mono-tech uppercase tracking-widest">Inicia en</span>
                                    </div>
                                    <div id="countdown-display" class="text-2xl font-mono-tech font-medium text-white tracking-widest tabular-nums">
                                        --:--:--
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Details -->
                        <div class="lg:col-span-7 p-8 md:p-14 flex flex-col bg-slate-900/40 relative">
                            <div class="mb-10">
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="h-[1px] w-8 bg-[var(--color-accent)]/50"></div>
                                    <span class="text-[var(--color-accent)] font-mono-tech text-[10px] uppercase tracking-[0.4em]">Encuentro Presencial</span>
                                </div>
                                <h2 class="text-5xl md:text-7xl font-ethereal font-bold text-white mb-6 leading-[0.9] tracking-tighter uppercase">
                                    QUE SE TE<br><span class="text-[var(--color-accent)]">NOTE</span>
                                </h2>
                                <p class="text-white/60 font-mono-tech text-[10px] md:text-xs tracking-[0.2em] uppercase mb-8">Tus frutos hablan por ti</p>
                                <p class="text-slate-300 text-lg md:text-xl font-serif-elegant italic leading-relaxed max-w-md">
                                    "Si hoy tus frutos hablaran... ¿qué dirían de ti?"
                                </p>
                            </div>

                            <div class="grid grid-cols-2 gap-8 mb-10 border-y border-white/5 py-10">
                                <div class="space-y-3">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest font-semibold">Fecha</h4>
                                    <p class="text-white font-ethereal text-2xl md:text-3xl font-light">26 • 04 • 26</p>
                                    <p class="text-[var(--color-accent)] text-[10px] font-mono-tech uppercase tracking-tighter font-bold">DOMINGO</p>
                                </div>
                                <div class="space-y-3">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest font-semibold">Hora</h4>
                                    <p class="text-white font-ethereal text-2xl md:text-3xl font-light">11:00 AM</p>
                                    <p class="text-[var(--color-accent)] text-[10px] font-mono-tech uppercase font-bold">MAÑANA</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 gap-4 mt-auto">
                                <button onclick="updateState({modal:'rsvp'})" class="group relative py-5 bg-[var(--color-accent)] text-white font-mono-tech uppercase tracking-widest text-xs font-bold overflow-hidden transition-all hover:bg-[var(--color-accent-dark)] flex items-center justify-center gap-3 rounded-xl shadow-lg shadow-[var(--color-accent)]/20">
                                    Confirmar Asistencia
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                                </button>
                                <div class="flex gap-4">
                                    <a href="${GUIDE_URL}" target="_blank" class="flex-1 py-4 border border-white/10 text-slate-400 hover:text-white font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5 rounded-xl flex items-center justify-center gap-2">
                                        Guía
                                    </a>
                                    <button onclick="handleJoin()" class="flex-1 py-4 border border-white/10 text-slate-400 hover:text-[var(--color-accent)] font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5 rounded-xl">
                                        En Vivo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="updateState({view:'cover'})" class="absolute top-6 right-6 text-slate-600 hover:text-white transition-colors p-2 z-20">
                         <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
             `;
        }

        function RenderModal() {
            if (!state.modal) return '';

            if (state.modal === 'rsvp') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                        <div class="w-full max-w-md fog-panel p-8 md:p-10 rounded-[2.5rem] relative border border-[var(--color-accent)]/20">
                            <button onclick="updateState({modal:null})" class="absolute top-6 right-6 text-slate-500 hover:text-white p-2">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                            
                            <h3 class="text-3xl text-white font-ethereal font-light mb-8">Confirmar Presencia</h3>
                            
                            <form onsubmit="handleRSVP(event)" class="space-y-6 md:space-y-8">
                                <div class="space-y-2">
                                    <label class="block text-[var(--color-accent)]/50 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Nombre</label>
                                    <input required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value" 
                                        class="w-full bg-white/5 border-b border-white/10 py-3 text-white focus:border-[var(--color-accent)] focus:outline-none transition-all placeholder:text-slate-700" placeholder="Nombre completo">
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-[var(--color-accent)]/50 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Correo</label>
                                    <input required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                        class="w-full bg-white/5 border-b border-white/10 py-3 text-white focus:border-[var(--color-accent)] focus:outline-none transition-all placeholder:text-slate-700" placeholder="correo@ejemplo.com">
                                </div>
                                
                                <button type="submit" ${state.sending ? 'disabled' : ''} class="w-full py-5 bg-[var(--color-accent)] text-white font-mono-tech font-bold uppercase tracking-widest text-[10px] hover:bg-[var(--color-accent-dark)] transition-all disabled:opacity-30 rounded-xl shadow-lg shadow-[var(--color-accent)]/20">
                                    ${state.sending ? 'Enviando...' : 'Confirmar Asistencia'}
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (state.view === 'cover') content = RenderCover();
            else if (state.view === 'card') content = RenderCard();

            app.innerHTML = content + RenderModal();
        }

        window.onload = () => {
            render();
            setInterval(tick, 1000);
            tick();
        };

    </script>
</head>

<body
    class="bg-ethereal-pattern text-slate-200 antialiased min-h-screen relative overflow-x-hidden selection:bg-sky-500/30 selection:text-white">
    <div id="app" class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center"></div>
</body>

</html>
