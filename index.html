<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacer de Nuevo - Invitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            font-family: 'Inter', sans-serif;
            --color-smoke: #cbd5e1;
            --color-ethereal: #38bdf8;
            --color-deep: #0f172a;
        }

        .font-ethereal {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.01em;
        }

        .font-mono-tech {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Ethereal animations */
        @keyframes smoke-drift {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translate(20px, -20px) scale(1.1);
                opacity: 0.5;
            }

            100% {
                transform: translate(-10px, -40px) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes glow-pulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            }

            50% {
                box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            }
        }

        .animate-smoke {
            animation: smoke-drift 8s ease-out infinite;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow-pulse 4s ease-in-out infinite;
        }

        /* Glass / Fog Panel */
        .fog-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Background Pattern */
        .bg-ethereal-pattern {
            background-color: #020617;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(148, 163, 184, 0.05) 0px, transparent 50%);
        }

        .smoke-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .modal-open {
            overflow: hidden;
        }
    </style>
    <script>
        // Configuración
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        const GUIDE_URL = "https://innovacion-con-clase.github.io/la-ciencia-de-atrapar-el-viento/";
        const MEET_URL = "https://meet.google.com/rsj-mbap-jpi";
        const EVENT_DATE = new Date("2026-03-01T11:00:00-05:00");

        let state = {
            view: 'cover',
            modal: null,
            rsvpName: "",
            rsvpEmail: "",
            sending: false,
            rsvpStatus: null,
            now: new Date(),
        };

        function updateState(updates) {
            state = { ...state, ...updates };
            render();
            document.body.classList.toggle('modal-open', !!state.modal);
        }

        function getTimeRemaining() {
            const total = EVENT_DATE - state.now;
            const seconds = Math.floor((total / 1000) % 60);
            const minutes = Math.floor((total / 1000 / 60) % 60);
            const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
            const days = Math.floor(total / (1000 * 60 * 60 * 24));

            const isLive = total <= 0 && total > -2 * 60 * 60 * 1000;
            const isEnded = total <= -2 * 60 * 60 * 1000;

            return { total, days, hours, minutes, seconds, isLive, isEnded };
        }

        function tick() {
            state.now = new Date();
            const el = document.getElementById('countdown-display');
            if (el) {
                const t = getTimeRemaining();
                if (t.isLive) el.innerText = "EN VIVO";
                else if (t.isEnded) el.innerText = "EVENTO FINALIZADO";
                else {
                    let text = ``;
                    if (t.days > 0) text += `${t.days}d `;
                    text += `${String(t.hours).padStart(2, '0')}:${String(t.minutes).padStart(2, '0')}:${String(t.seconds).padStart(2, '0')}`;
                    el.innerText = text;
                }
            }
        }

        async function handleRSVP(e) {
            e.preventDefault();
            if (!state.rsvpName || !state.rsvpEmail.includes('@')) {
                alert("Por favor verifica tus datos.");
                return;
            }

            updateState({ sending: true });

            try {
                const formData = new URLSearchParams();
                formData.append('name', state.rsvpName);
                formData.append('email', state.rsvpEmail);
                formData.append('timestamp', new Date().toISOString());
                formData.append('source', 'BiografiaDelHumoWeb');

                await fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                updateState({ sending: false, rsvpStatus: 'success', modal: null });
                setTimeout(() => alert("¡Confirmado! Te esperamos en la nube."), 500);

            } catch (err) {
                console.error(err);
                updateState({ sending: false, rsvpStatus: 'error' });
                alert("Hubo un problema. Intenta nuevamente.");
            }
        }

        function handleJoin() {
            const { total } = getTimeRemaining();
            if (total > 15 * 60 * 1000) {
                alert("La señal aún no está lista. Conéctate 15 minutos antes.");
                return;
            }
            window.open(MEET_URL, '_blank');
        }

        function RenderCover() {
            return `
                <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 animate-fade-in overflow-hidden">
                    <!-- Smoke Particles Decoration -->
                    <div class="absolute inset-0 pointer-events-none">
                        <div class="smoke-particle animate-smoke" style="width: 300px; height: 300px; top: 20%; left: 10%; animation-delay: 0s"></div>
                        <div class="smoke-particle animate-smoke" style="width: 200px; height: 200px; top: 50%; left: 70%; animation-delay: 2s"></div>
                        <div class="smoke-particle animate-smoke" style="width: 400px; height: 400px; top: 10%; left: 40%; animation-delay: 4s"></div>
                    </div>

                    <div class="relative mb-12 animate-float">
                        <div class="w-24 h-24 rounded-full border border-white/20 flex items-center justify-center bg-white/5 backdrop-blur-sm shadow-2xl">
                             <svg class="w-10 h-10 text-sky-400 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                            </svg>
                        </div>
                        <div class="absolute -inset-4 bg-sky-500/10 rounded-full blur-2xl animate-pulse"></div>
                    </div>

                    <div class="space-y-4 mb-12 relative z-20">
                        <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-slate-400 text-[10px] font-mono-tech tracking-[0.3em] uppercase">
                            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                            Inmersión Disponible
                        </div>
                        <h1 class="text-6xl md:text-8xl font-ethereal font-semibold text-white tracking-tight leading-none">
                            NACER DE<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-500">NUEVO</span>
                        </h1>
                        <p class="text-slate-400 text-lg md:text-xl font-light tracking-wide max-w-xl mx-auto italic">
                            "El Inicio de tu Nueva Historia"
                        </p>
                    </div>

                    <button onclick="updateState({view: 'card'})" class="group relative px-10 py-4 bg-transparent text-white font-mono-tech uppercase tracking-[0.2em] text-xs overflow-hidden transition-all duration-500">
                        <div class="absolute inset-0 border border-white/20 group-hover:bg-white/5 transition-all"></div>
                        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-sky-500 scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-500"></div>
                        <span class="relative">Explorar Relato</span>
                    </button>
                    
                    <div class="absolute bottom-12 text-[10px] font-mono-tech text-slate-500 uppercase tracking-[0.4em]">
                        Mauricio Bedoya /// 01.03.2026
                    </div>

                </div>
            `;
        }

        function RenderCard() {
            const t = getTimeRemaining();

            return `
                <div class="w-full max-w-6xl p-4 md:p-8 animate-fade-in-up flex items-center justify-center">
                    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-0 fog-panel rounded-3xl overflow-hidden relative border border-white/5">
                        <!-- Left: Visual -->
                        <div class="lg:col-span-5 relative bg-slate-950 p-0 flex flex-col justify-end min-h-[500px] overflow-hidden group">
                            <div class="absolute inset-0 contrast-110 brightness-100 transition-all duration-1000">
                                <img src="http://static1.squarespace.com/static/5148b380e4b0106646129f8e/5148b7cae4b08bb38b2081ed/5c3cedc740ec9ab9b90125bc/1547497936548/nacer-de-nuevo+1755.jpg" class="w-full h-full object-cover scale-110 group-hover:scale-100 transition-transform duration-[2000ms]" />
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-90"></div>
                            </div>
                            
                            <div class="relative z-10 p-10 space-y-6">
                                <div class="space-y-1">
                                    <h3 class="text-sky-400 font-mono-tech text-[10px] uppercase tracking-[0.3em]">Invitado Especial</h3>
                                    <p class="text-white font-ethereal text-3xl font-light tracking-tight">MAURICIO BEDOYA</p>
                                </div>

                                
                                <div class="p-6 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl">
                                    <div class="flex justify-between items-center mb-4">
                                        <span class="text-slate-400 text-[10px] font-mono-tech uppercase tracking-widest">Cuenta Regresiva</span>
                                        <div class="flex gap-1">
                                            <div class="w-1 h-1 rounded-full bg-sky-400 animate-pulse"></div>
                                            <div class="w-1 h-1 rounded-full bg-sky-400 animate-pulse" style="animation-delay: 0.2s"></div>
                                        </div>
                                    </div>
                                    <div id="countdown-display" class="text-4xl font-mono-tech font-medium text-white tracking-widest tabular-nums">
                                        --:--:--
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Details -->
                        <div class="lg:col-span-7 p-8 md:p-14 flex flex-col bg-slate-900/40 relative">
                            <div class="mb-12">
                                <div class="flex items-center gap-4 mb-8">
                                    <div class="h-[1px] w-12 bg-sky-500/50"></div>
                                    <span class="text-sky-400 font-mono-tech text-[10px] uppercase tracking-[0.4em]">Invitación Digital</span>
                                </div>
                                <h2 class="text-5xl md:text-6xl font-ethereal font-semibold text-white mb-8 leading-[0.9] tracking-tighter">
                                    NACER DE<br><span class="opacity-50">NUEVO</span>
                                </h2>
                                <p class="text-slate-400 text-lg font-light leading-relaxed max-w-md">
                                    Te invitamos a un encuentro de transformación. Es momento de dejar atrás lo viejo y abrazar el propósito de una vida renovada.
                                </p>
                            </div>

                            <div class="grid grid-cols-2 gap-12 mb-12 border-y border-white/5 py-10">
                                <div class="space-y-2">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest">Fecha</h4>
                                    <p class="text-white font-ethereal text-2xl font-light">01 • 03 • 26</p>
                                    <p class="text-sky-400/60 text-xs font-mono-tech">DOMINGO</p>
                                </div>
                                <div class="space-y-2">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest">Inicia</h4>
                                    <p class="text-white font-ethereal text-2xl font-light">11:00 AM</p>
                                    <p class="text-sky-400/60 text-xs font-mono-tech">GMT-5</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                                <button onclick="handleJoin()" id="btn-join" class="group relative py-5 bg-white text-slate-900 font-mono-tech uppercase tracking-widest text-[10px] font-bold overflow-hidden transition-all hover:bg-sky-400 hover:text-white">
                                    <span class="relative z-10 flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                        Conectar
                                    </span>
                                </button>
                                <div class="flex gap-2">
                                    <button onclick="updateState({modal:'rsvp'})" class="flex-1 py-5 border border-white/10 hover:border-white/30 text-slate-400 hover:text-white font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5">
                                        RSVP
                                    </button>
                                    <button onclick="window.open(GUIDE_URL, '_blank')" class="flex-1 py-5 border border-white/10 hover:border-white/30 text-slate-400 hover:text-white font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5">
                                        Info
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="updateState({view:'cover'})" class="absolute top-8 right-8 text-slate-600 hover:text-white transition-colors p-2">
                         <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
             `;
        }

        function RenderModal() {
            if (!state.modal) return '';

            if (state.modal === 'rsvp') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                        <div class="w-full max-w-md fog-panel p-10 rounded-3xl relative border border-white/10">
                            <button onclick="updateState({modal:null})" class="absolute top-6 right-6 text-slate-500 hover:text-white p-2">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                            
                            <h3 class="text-3xl text-white font-ethereal font-light mb-8">Confirmar Presencia</h3>
                            
                            <form onsubmit="handleRSVP(event)" class="space-y-8">
                                <div class="space-y-2">
                                    <label class="block text-slate-500 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Identificación</label>
                                    <input required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value" 
                                        class="w-full bg-white/5 border-b border-white/10 py-3 text-white focus:border-sky-400 focus:outline-none transition-all placeholder:text-slate-700" placeholder="Nombre completo">
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-slate-500 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Canal de Contacto</label>
                                    <input required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                        class="w-full bg-white/5 border-b border-white/10 py-3 text-white focus:border-sky-400 focus:outline-none transition-all placeholder:text-slate-700" placeholder="correo@ejemplo.com">
                                </div>
                                
                                <button type="submit" ${state.sending ? 'disabled' : ''} class="w-full py-4 bg-sky-500 text-white font-mono-tech font-bold uppercase tracking-widest text-[10px] hover:bg-sky-400 transition-all disabled:opacity-30 rounded-lg">
                                    ${state.sending ? 'Sincronizando...' : 'Confirmar Registro'}
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (state.view === 'cover') content = RenderCover();
            else if (state.view === 'card') content = RenderCard();

            app.innerHTML = content + RenderModal();
        }

        window.onload = () => {
            render();
            setInterval(tick, 1000);
            tick();
        };

    </script>
</head>

<body
    class="bg-ethereal-pattern text-slate-200 antialiased min-h-screen relative overflow-x-hidden selection:bg-sky-500/30 selection:text-white">
    <div id="app" class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center"></div>
</body>

</html>
