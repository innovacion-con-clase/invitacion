<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Enemigo en el espejo - Invitación Digital</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            font-family: 'Inter', sans-serif;
        }

        .font-main { font-family: 'Cinzel', serif; }
        .font-literary { font-family: 'Playfair Display', serif; }

        .modal-open { overflow: hidden; }

        /* Animaciones Celestiales */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-twinkle { animation: twinkle 4s ease-in-out infinite; }
        .animate-spin-slow { animation: spin-slow 12s linear infinite; }

        .shine-text {
            background: linear-gradient(90deg, #fbbf24 0%, #ffffff 50%, #fbbf24 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 6s linear infinite;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .hex-alt {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .portal-glow {
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.2), inset 0 0 30px rgba(244, 63, 94, 0.1);
        }

        .fade-enter {
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        const GUIDE_URL = "https://wparejac.github.io/enemigo-en-el-espejo/";
        const MEET_URL = "https://meet.google.com/iyi-vpny-izp";
        const IMAGE_URL = "https://i.imgur.com/ncZnQAB.jpeg";

        let state = {
            openCover: false,
            openGuide: false,
            openRSVP: false,
            rsvpName: "",
            rsvpEmail: "",
            rsvpSent: false,
            sending: false,
            joinModalOpen: false,
            messageModal: null,
            // FECHA ACTUALIZADA: 01 de febrero de 2026, 11:00 AM
            eventDate: new Date("2026-02-01T11:00:00-05:00"),
            now: new Date(),
        };

        function updateState(newState) {
            state = { ...state, ...newState };
            render();
            const open = state.openGuide || state.openRSVP || state.joinModalOpen || state.messageModal;
            document.body.classList.toggle('modal-open', open);
        }

        function calculateCountdown() {
            const timeDiff = state.eventDate - state.now;
            const canJoin = timeDiff <= 10 * 60 * 1000 && timeDiff > -2 * 60 * 60 * 1000;

            const days = Math.max(0, Math.floor(timeDiff / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const minutes = Math.max(0, Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60)));
            const seconds = Math.max(0, Math.floor((timeDiff % (1000 * 60)) / 1000));

            let countdownText = "";
            if (timeDiff > 0) {
                if (days > 0) countdownText += `${days}d `;
                countdownText += `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            } else if (timeDiff > -2 * 60 * 60 * 1000) {
                countdownText = "¡EN VIVO!";
            } else {
                countdownText = "Finalizado";
            }

            return { canJoin, countdownText };
        }

        function tick() {
            state.now = new Date();
            const { canJoin, countdownText } = calculateCountdown();
            const countdownEl = document.getElementById('countdown');
            if (countdownEl) countdownEl.textContent = countdownText;
            
            const joinBtn = document.getElementById('join-btn');
            if (joinBtn) {
                if (canJoin) {
                    joinBtn.classList.remove('bg-slate-800', 'text-slate-400', 'cursor-not-allowed');
                    joinBtn.classList.add('bg-amber-600', 'text-white', 'shadow-[0_10px_30px_rgba(217,119,6,0.3)]');
                }
            }
        }

        async function submitRsvp(e) {
            e.preventDefault();
            if (!state.rsvpName.trim() || !state.rsvpEmail.trim()) {
                updateState({ messageModal: { title: "Campos Incompletos", message: "Por favor, completa todos los campos.", type: "error" } });
                return;
            }

            updateState({ sending: true });
            const payload = {
                name: state.rsvpName,
                email: state.rsvpEmail,
                timestamp: new Date().toISOString(),
                source: "InvitacionWeb-EnemigoEspejo"
            };

            try {
                const params = new URLSearchParams();
                Object.keys(payload).forEach(k => params.append(k, payload[k]));

                await fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                updateState({
                    rsvpSent: true,
                    rsvpName: "",
                    rsvpEmail: "",
                    messageModal: { title: "¡Inscrito!", message: "Hemos reservado tu lugar para esta sesión.", type: "success" }
                });
                setTimeout(() => updateState({ openRSVP: false }), 3000);
            } catch (err) {
                updateState({ messageModal: { title: "Error", message: "No se pudo procesar tu inscripción.", type: "error" } });
            } finally {
                updateState({ sending: false });
            }
        }

        function renderMessageModal() {
            if (!state.messageModal) return '';
            const { title, message, type } = state.messageModal;
            const bgColor = type === "error" ? "bg-rose-900/90" : "bg-emerald-900/90";

            return `
                <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 fade-enter">
                    <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="updateState({ messageModal: null })"></div>
                    <div class="relative w-full max-w-sm rounded-2xl p-8 shadow-2xl z-20 ${bgColor} text-white border border-white/20 text-center">
                        <h4 class="text-2xl font-bold font-main mb-4">${title}</h4>
                        <p class="text-white/80 mb-8 font-literary text-lg leading-relaxed">${message}</p>
                        <button onclick="updateState({ messageModal: null })" class="px-8 py-2 rounded-full bg-white text-slate-900 font-main font-bold hover:bg-amber-100 transition">Entendido</button>
                    </div>
                </div>
            `;
        }

        function renderJoinModal() {
            if (!state.joinModalOpen) return '';
            return `
                <div class="fixed inset-0 z-[60] flex items-center justify-center p-4 fade-enter">
                    <div class="absolute inset-0 bg-black/85 backdrop-blur-sm" onclick="updateState({ joinModalOpen: false })"></div>
                    <div class="relative bg-slate-900 border border-amber-500/30 rounded-2xl p-10 shadow-2xl max-w-md w-full z-10 text-center">
                        <div class="w-20 h-20 rounded-full bg-amber-500/10 flex items-center justify-center mx-auto mb-8 border border-amber-500/20 animate-float">
                            <svg class="w-10 h-10 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </div>
                        <h4 class="text-3xl font-bold text-amber-100 font-main mb-4">Sala en Preparación</h4>
                        <p class="text-slate-300 mb-8 leading-relaxed font-literary text-lg">
                            El acceso se habilitará 10 minutos antes de las 11:00 AM.<br>
                            ¡Gracias por tu paciencia!
                        </p>
                        <button onclick="updateState({ joinModalOpen: false })" class="px-10 py-3 rounded-full bg-gradient-to-r from-amber-600 to-amber-800 text-white font-bold font-main tracking-widest hover:brightness-110 transition w-full uppercase text-sm">Cerrar</button>
                    </div>
                </div>
            `;
        }

        function renderRSVPModal() {
            if (!state.openRSVP) return '';
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 fade-enter">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="updateState({ openRSVP: false })"></div>
                    <form onsubmit="submitRsvp(event)" class="relative w-full max-w-md bg-[#0F172A] border border-amber-500/20 rounded-2xl p-10 shadow-2xl z-10">
                        <h3 class="text-3xl font-bold text-white font-main mb-2 text-center">Reserva tu Lugar</h3>
                        <p class="text-amber-400/80 mb-10 text-center font-literary italic">"Sincroniza tu corazón antes de entrar"</p>
                        
                        <div class="space-y-6">
                            <div>
                                <label class="block text-[10px] uppercase text-slate-400 font-bold mb-2 tracking-widest font-main">Nombre</label>
                                <input required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value"
                                    class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-4 text-amber-100 focus:border-amber-500 focus:outline-none transition font-literary text-lg" placeholder="Tu nombre...">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase text-slate-400 font-bold mb-2 tracking-widest font-main">Email</label>
                                <input required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                    class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-4 text-amber-100 focus:border-amber-500 focus:outline-none transition font-literary text-lg" placeholder="ejemplo@correo.com">
                            </div>
                        </div>

                        <div class="mt-12 flex gap-4">
                            <button type="submit" ${state.sending ? 'disabled' : ''} class="flex-1 py-4 rounded-lg bg-amber-600 text-white font-main font-bold uppercase text-xs tracking-widest hover:bg-amber-500 transition disabled:opacity-50 flex justify-center items-center gap-2">
                                ${state.sending ? '<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>' : ''} Confirmar
                            </button>
                            <button type="button" onclick="updateState({ openRSVP: false })" class="px-6 py-4 rounded-lg border border-slate-700 text-slate-400 font-main text-xs font-bold uppercase tracking-widest hover:text-white transition">Cerrar</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            const { openCover } = state;
            const { canJoin, countdownText } = calculateCountdown();

            let mainContent = '';

            if (!openCover) {
                mainContent = `
                    <div class="text-center p-8 max-w-2xl w-full fade-enter relative">
                        <div class="absolute top-0 left-10 w-1 h-1 bg-white rounded-full animate-twinkle" style="animation-delay: 0.2s"></div>
                        <div class="absolute top-20 right-20 w-1.5 h-1.5 bg-amber-200 rounded-full animate-twinkle" style="animation-delay: 0.7s"></div>

                        <!-- HEXAGON CENTRAL -->
                        <div class="relative mx-auto mb-16 mt-4 w-64 h-72 animate-float group">
                            <div class="absolute inset-0 bg-amber-500/20 blur-[60px] rounded-full animate-pulse"></div>
                            
                            <div class="absolute inset-0 hex-alt bg-gradient-to-tr from-transparent via-amber-400 to-transparent opacity-60 animate-spin-slow"></div>
                            <div class="absolute inset-1 hex-alt bg-gradient-to-bl from-transparent via-rose-500 to-transparent opacity-40 animate-spin-slow" style="animation-direction: reverse; animation-duration: 15s;"></div>

                            <div class="absolute inset-[4px] hex-alt bg-[#050B14] z-10 flex items-center justify-center p-1 portal-glow">
                                <div class="w-full h-full hex-alt overflow-hidden relative">
                                    <img src="${IMAGE_URL}" class="w-full h-full object-cover scale-110 group-hover:scale-125 transition-transform duration-1000" alt="El Enemigo en el espejo">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
                                </div>
                            </div>
                        </div>
                        
                        <h1 class="text-5xl md:text-7xl font-bold font-main text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-300 to-amber-500 mb-8 leading-tight drop-shadow-xl">
                            El Enemigo en<br>el espejo
                        </h1>
                        
                        <div class="flex items-center justify-center gap-6 mb-16 opacity-90">
                            <div class="h-[1px] w-16 bg-gradient-to-r from-transparent to-amber-500/50"></div>
                            <p class="text-xl md:text-2xl text-amber-100 font-literary italic tracking-wide font-light">"Cuando el éxito suena fuerte, pero el corazón está desafinado"</p>
                            <div class="h-[1px] w-16 bg-gradient-to-l from-transparent to-amber-500/50"></div>
                        </div>

                        <button onclick="updateState({ openCover: true })"
                            class="group relative px-12 py-5 bg-transparent overflow-hidden rounded-full transition-all hover:scale-105 border border-amber-500/40">
                            <div class="absolute inset-0 bg-amber-900/10 group-hover:bg-amber-900/30 transition-colors"></div>
                            <span class="relative text-amber-200 font-main font-bold tracking-[0.4em] uppercase text-sm group-hover:text-white transition-colors">Ver Detalles</span>
                        </button>
                    </div>
                `;
            } else {
                mainContent = `
                    <div class="w-full max-w-5xl fade-enter">
                        <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl relative border border-white/5">
                            <div class="grid grid-cols-1 md:grid-cols-12 relative z-10 min-h-[600px]">
                                
                                <div class="md:col-span-5 p-12 flex flex-col justify-center items-center text-center bg-black/40 relative overflow-hidden group">
                                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-amber-500/10 blur-[80px] rounded-full"></div>

                                    <div class="relative w-64 h-72 animate-float z-10">
                                        <div class="absolute -inset-1 hex-alt bg-conic-gradient(from 0deg, transparent, #fbbf24, transparent) opacity-40 animate-spin-slow"></div>
                                        <div class="absolute inset-[3px] hex-alt bg-black border border-amber-500/20 overflow-hidden">
                                            <img src="${IMAGE_URL}" alt="Portada" class="w-full h-full object-cover scale-110 filter brightness-90 group-hover:brightness-110 transition-all duration-1000">
                                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                                        </div>
                                    </div>

                                    <div class="mt-12 text-amber-200/60 font-main text-[10px] tracking-[0.5em] uppercase">Un análisis del ser</div>
                                </div>

                                <div class="md:col-span-7 p-10 md:p-16 flex flex-col justify-center bg-gradient-to-br from-slate-900/50 to-black/50">
                                    <div class="mb-12">
                                        <div class="flex items-center gap-3 mb-6">
                                            <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></span>
                                            <span class="text-xs font-main font-bold text-amber-400/80 uppercase tracking-[0.4em]">Sesión de Transformación</span>
                                        </div>
                                        <h2 class="text-4xl md:text-6xl font-bold text-white font-main mb-6 leading-[1.1]">El Enemigo en <br><span class="shine-text">el espejo</span></h2>
                                        <p class="text-xl text-slate-300 font-literary italic leading-relaxed border-l-4 border-amber-500/40 pl-6 py-2">
                                            Cuando el éxito suena fuerte, pero el corazón está desafinado.
                                        </p>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-10 mb-12">
                                        <div>
                                            <p class="text-[10px] uppercase text-slate-500 font-bold mb-2 tracking-widest font-main">Fecha</p>
                                            <h3 class="text-3xl font-bold text-white font-main mb-1">01 Feb 2026</h3>
                                            <p class="text-lg text-slate-400">Domingo • 11:00 A.M.</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] uppercase text-slate-500 font-bold mb-2 tracking-widest font-main">Faltan:</p>
                                            <p id="countdown" class="text-3xl font-mono text-amber-200 font-bold">${countdownText}</p>
                                        </div>
                                    </div>

                                    <div class="flex flex-col sm:flex-row gap-5">
                                        <button id="join-btn" onclick="state.eventDate - state.now <= 10 * 60 * 1000 ? window.open('https://' + MEET_URL.replace('https://', ''), '_blank') : updateState({ joinModalOpen: true })" 
                                            class="flex-1 px-8 py-5 rounded-xl font-main font-bold uppercase text-xs tracking-[0.3em] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3
                                            ${canJoin ? 'bg-amber-600 text-white shadow-[0_10px_30px_rgba(217,119,6,0.3)]' : 'bg-slate-800 text-slate-400 cursor-not-allowed'}">
                                            <span>Entrar a la Reunión</span>
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                        </button>
                                        
                                        <div class="flex gap-4">
                                            <button onclick="window.open(GUIDE_URL, '_blank')" class="px-8 py-5 rounded-xl border border-slate-700 text-slate-300 font-main font-bold uppercase text-[10px] tracking-[0.3em] hover:border-amber-500/50 hover:text-amber-100 transition text-center flex-1">
                                                Guía
                                            </button>
                                            <button onclick="updateState({ openRSVP: true })" class="px-8 py-5 rounded-xl border border-slate-700 text-slate-300 font-main font-bold uppercase text-[10px] tracking-[0.3em] hover:border-amber-500/50 hover:text-white transition text-center flex-1">
                                                RSVP
                                            </button>
                                        </div>
                                    </div>
                                    <button onclick="updateState({ openCover: false })" class="mt-8 text-[10px] font-main text-slate-600 hover:text-slate-400 uppercase tracking-[0.3em] self-start transition">← Regresar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = `
                <main class="min-h-screen bg-[#020617] relative flex items-center justify-center p-6 selection:bg-amber-500/30 overflow-hidden">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-amber-900/10 via-[#020617] to-[#020617]"></div>
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_right,_var(--tw-gradient-stops))] from-rose-950/10 via-transparent to-transparent"></div>
                    
                    ${mainContent}
                </main>
                ${renderJoinModal()}
                ${renderRSVPModal()}
                ${renderMessageModal()}
            `;
        }

        window.onload = function () {
            setInterval(tick, 1000);
            tick();
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    updateState({ openRSVP: false, joinModalOpen: false, messageModal: null });
                }
            });
            render();
        };
    </script>
</head>

<body class="bg-[#020617] text-slate-200 antialiased">
    <div id="app"></div>
</body>

</html>
