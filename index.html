<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Idioma de lo Extraordinario - Invitación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            font-family: 'Inter', sans-serif;
            --color-accent: #22d3ee; /* cyan-400 */
            --color-accent-dark: #0891b2; /* cyan-600 */
            --color-deep: #0f172a;
        }

        .font-ethereal {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.01em;
        }

        .font-mono-tech {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Ethereal animations */
        @keyframes sun-glow {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes radar-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .animate-radar::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px solid var(--color-accent);
            border-radius: 50%;
            animation: radar-pulse 4s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .animate-sun {
            animation: sun-glow 10s ease-in-out infinite;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow-pulse 4s ease-in-out infinite;
        }

        /* Glass / Fog Panel */
        .fog-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 211, 238, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Background Pattern */
        .bg-ethereal-pattern {
            background-color: #020617;
            background-image: url('https://i.imgur.com/wWGLGi6.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .light-ray {
            position: absolute;
            background: linear-gradient(to bottom, rgba(251, 191, 36, 0.2), transparent);
            width: 2px;
            pointer-events: none;
        }
    </style>
    <script>
        // Configuración
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyonuNONVfbmiwAUI0_koTsWABOSJ7iIFZp1dnLYDSKEPlmOJeA09h3BDlF0WhW7paN/exec";
        const GUIDE_URL = "https://innovacion-con-clase.github.io/milagros/";
        const MEET_URL = "https://meet.google.com/rsj-mbap-jpi";
        const EVENT_DATE = new Date("2026-03-15T11:00:00-05:00");

        let state = {
            view: 'cover',
            modal: null,
            rsvpName: "",
            rsvpEmail: "",
            sending: false,
            rsvpStatus: null,
            now: new Date(),
        };

        function updateState(updates) {
            state = { ...state, ...updates };
            render();
            document.body.classList.toggle('modal-open', !!state.modal);
        }

        function getTimeRemaining() {
            const total = EVENT_DATE - state.now;
            const seconds = Math.floor((total / 1000) % 60);
            const minutes = Math.floor((total / 1000 / 60) % 60);
            const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
            const days = Math.floor(total / (1000 * 60 * 60 * 24));

            const isLive = total <= 0 && total > -2 * 60 * 60 * 1000;
            const isEnded = total <= -2 * 60 * 60 * 1000;

            return { total, days, hours, minutes, seconds, isLive, isEnded };
        }

        function tick() {
            state.now = new Date();
            const el = document.getElementById('countdown-display');
            if (el) {
                const t = getTimeRemaining();
                if (t.isLive) el.innerText = "EN VIVO";
                else if (t.isEnded) el.innerText = "EVENTO FINALIZADO";
                else {
                    let text = ``;
                    if (t.days > 0) text += `${t.days}d `;
                    text += `${String(t.hours).padStart(2, '0')}:${String(t.minutes).padStart(2, '0')}:${String(t.seconds).padStart(2, '0')}`;
                    el.innerText = text;
                }
            }
        }

        async function handleRSVP(e) {
            e.preventDefault();
            if (!state.rsvpName || !state.rsvpEmail.includes('@')) {
                alert("Por favor verifica tus datos.");
                return;
            }

            updateState({ sending: true });

            try {
                const formData = new URLSearchParams();
                formData.append('name', state.rsvpName);
                formData.append('email', state.rsvpEmail);
                formData.append('timestamp', new Date().toISOString());
                formData.append('source', 'BiografiaDelHumoWeb');

                await fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                updateState({ sending: false, rsvpStatus: 'success', modal: null });
                setTimeout(() => alert("¡Confirmado! Te esperamos."), 500);

            } catch (err) {
                console.error(err);
                updateState({ sending: false, rsvpStatus: 'error' });
                alert("Hubo un problema. Intenta nuevamente.");
            }
        }

        function handleJoin() {
            const { total } = getTimeRemaining();
            if (total > 15 * 60 * 1000) {
                alert("La señal aún no está lista. Conéctate 15 minutos antes.");
                return;
            }
            window.open(MEET_URL, '_blank');
        }

        function RenderCover() {
            return `
                <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 animate-fade-in overflow-hidden">
                    <div class="absolute inset-0 bg-black/40 z-0"></div>
                    
                    <div class="relative mb-12 animate-float animate-radar z-10">
                        <div class="w-24 h-24 rounded-full border border-cyan-400/30 flex items-center justify-center bg-white/5 backdrop-blur-sm shadow-2xl">
                             <svg class="w-10 h-10 text-cyan-400 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <div class="absolute -inset-4 bg-cyan-500/10 rounded-full blur-2xl animate-pulse"></div>
                    </div>

                    <div class="space-y-4 mb-12 relative z-10">
                        <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-cyan-400/80 text-[10px] font-mono-tech tracking-[0.3em] uppercase">
                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                            FRECUENCIA DE MILAGROS
                        </div>
                        <h1 class="text-6xl md:text-7xl font-ethereal font-semibold text-white tracking-tight leading-none uppercase">
                            EL IDIOMA DE LO<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-500">EXTRAORDINARIO</span>
                        </h1>
                        <p class="text-cyan-100/70 text-sm md:text-base font-mono-tech tracking-widest uppercase mb-2">
                            EXPANDE TUS LÍMITES
                        </p>
                        <p class="text-white/90 text-lg md:text-xl font-light tracking-wide max-w-2xl mx-auto italic leading-relaxed">
                            "Sintonizando la frecuencia de los milagros"
                        </p>
                    </div>

                    <button onclick="updateState({view: 'card'})" class="group relative z-10 px-10 py-4 bg-transparent text-white font-mono-tech uppercase tracking-[0.2em] text-xs overflow-hidden transition-all duration-500">
                        <div class="absolute inset-0 border border-cyan-400/30 group-hover:bg-cyan-400/10 transition-all"></div>
                        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-cyan-500 scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-500"></div>
                        <span class="relative">Ingresar al encuentro</span>
                    </button>
                    
                    <div class="absolute bottom-12 z-10 text-[10px] font-mono-tech text-cyan-200/50 uppercase tracking-[0.4em]">
                        Radar del Cielo /// Experiencia Virtual
                    </div>

                </div>
            `;
        }

        function RenderCard() {
            const t = getTimeRemaining();

            return `
                <div class="w-full max-w-6xl p-4 md:p-8 animate-fade-in-up flex items-center justify-center">
                    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-0 fog-panel rounded-3xl overflow-hidden relative border border-white/5">
                        <!-- Left: Visual -->
                        <div class="lg:col-span-5 relative bg-slate-950 p-0 flex flex-col justify-end min-h-[500px] overflow-hidden group">
                            <div class="absolute inset-0 contrast-110 brightness-100 transition-all duration-1000">
                                <img src="https://i.imgur.com/wWGLGi6.jpeg" class="w-full h-full object-cover scale-110 group-hover:scale-100 transition-transform duration-[2000ms]" />
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-90"></div>
                            </div>
                            
                            <div class="relative z-10 p-10 space-y-6">
                                <div class="space-y-1">
                                    <h3 class="text-cyan-400 font-mono-tech text-[10px] uppercase tracking-[0.3em]">Experiencia</h3>
                                    <p class="text-white font-ethereal text-3xl font-light tracking-tight">RADAR DEL CIELO</p>
                                </div>

                                <div class="p-6 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl">
                                    <div class="flex justify-between items-center mb-4">
                                        <span class="text-cyan-200/50 text-[10px] font-mono-tech uppercase tracking-widest">Inicia en</span>
                                        <div class="flex gap-1">
                                            <div class="w-1 h-1 rounded-full bg-cyan-400 animate-pulse"></div>
                                            <div class="w-1 h-1 rounded-full bg-cyan-400 animate-pulse" style="animation-delay: 0.2s"></div>
                                        </div>
                                    </div>
                                    <div id="countdown-display" class="text-4xl font-mono-tech font-medium text-white tracking-widest tabular-nums">
                                        --:--:--
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Details -->
                        <div class="lg:col-span-7 p-8 md:p-14 flex flex-col bg-slate-900/40 relative">
                            <div class="mb-12">
                                <div class="flex items-center gap-4 mb-8">
                                    <div class="h-[1px] w-12 bg-cyan-500/50"></div>
                                    <span class="text-cyan-400 font-mono-tech text-[10px] uppercase tracking-[0.4em]">Encuentro Extraordinario</span>
                                </div>
                                <h2 class="text-5xl md:text-6xl font-ethereal font-semibold text-white mb-4 leading-[0.9] tracking-tighter uppercase">
                                    EL IDIOMA DE LO<br><span class="text-cyan-500">EXTRAORDINARIO</span>
                                </h2>
                                <p class="text-cyan-100/60 font-mono-tech text-xs tracking-[0.2em] mb-8">EXPANDE TUS LÍMITES</p>
                                <p class="text-slate-300 text-lg font-light leading-relaxed max-w-md italic">
                                    "Sintonizando la frecuencia de los milagros"
                                </p>
                            </div>

                            <div class="grid grid-cols-2 gap-12 mb-12 border-y border-white/5 py-10">
                                <div class="space-y-2">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest">Fecha</h4>
                                    <p class="text-white font-ethereal text-2xl font-light">15 • 03 • 26</p>
                                    <p class="text-cyan-400/60 text-xs font-mono-tech uppercase tracking-tighter">Radar del Cielo</p>
                                </div>
                                <div class="space-y-2">
                                    <h4 class="text-slate-500 font-mono-tech text-[10px] uppercase tracking-widest">Hora</h4>
                                    <p class="text-white font-ethereal text-2xl font-light">11:00 AM</p>
                                    <p class="text-cyan-400/60 text-xs font-mono-tech">DOMINGO</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                                <a href="${GUIDE_URL}" target="_blank" class="group relative py-5 bg-cyan-500 text-slate-900 font-mono-tech uppercase tracking-widest text-[10px] font-bold overflow-hidden transition-all hover:bg-cyan-400 hover:text-white flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18 18.247 18.477 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                    Guía del Evento
                                </a>
                                <div class="flex gap-2">
                                    <button onclick="updateState({modal:'rsvp'})" class="flex-1 py-5 border border-cyan-400/20 hover:border-cyan-400/50 text-cyan-200/70 hover:text-white font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5">
                                        RSVP
                                    </button>
                                    <button onclick="handleJoin()" class="flex-1 py-5 border border-white/10 text-slate-500 hover:text-cyan-400 font-mono-tech uppercase tracking-widest text-[10px] transition-all bg-white/5">
                                        VIVO
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="updateState({view:'cover'})" class="absolute top-8 right-8 text-slate-600 hover:text-amber-400 transition-colors p-2">
                         <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
             `;
        }

        function RenderModal() {
            if (!state.modal) return '';

            if (state.modal === 'rsvp') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                        <div class="w-full max-w-md fog-panel p-10 rounded-3xl relative border border-amber-400/20">
                            <button onclick="updateState({modal:null})" class="absolute top-6 right-6 text-slate-500 hover:text-white p-2">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                            
                            <h3 class="text-3xl text-white font-ethereal font-light mb-8">Confirmar Presencia</h3>
                            
                            <form onsubmit="handleRSVP(event)" class="space-y-8">
                                <div class="space-y-2">
                                    <label class="block text-cyan-400/50 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Nombre</label>
                                    <input required type="text" value="${state.rsvpName}" oninput="state.rsvpName = this.value" 
                                        class="w-full bg-white/5 border-b border-cyan-400/20 py-3 text-white focus:border-cyan-400 focus:outline-none transition-all placeholder:text-slate-700" placeholder="Nombre completo">
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-cyan-400/50 text-[10px] font-mono-tech uppercase tracking-[0.3em]">Correo</label>
                                    <input required type="email" value="${state.rsvpEmail}" oninput="state.rsvpEmail = this.value"
                                        class="w-full bg-white/5 border-b border-cyan-400/20 py-3 text-white focus:border-cyan-400 focus:outline-none transition-all placeholder:text-slate-700" placeholder="correo@ejemplo.com">
                                </div>
                                
                                <button type="submit" ${state.sending ? 'disabled' : ''} class="w-full py-4 bg-cyan-500 text-slate-900 font-mono-tech font-bold uppercase tracking-widest text-[10px] hover:bg-cyan-400 transition-all disabled:opacity-30 rounded-lg">
                                    ${state.sending ? 'Sintonizando...' : 'Conectar con el Evento'}
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (state.view === 'cover') content = RenderCover();
            else if (state.view === 'card') content = RenderCard();

            app.innerHTML = content + RenderModal();
        }

        window.onload = () => {
            render();
            setInterval(tick, 1000);
            tick();
        };

    </script>
</head>

<body
    class="bg-ethereal-pattern text-slate-200 antialiased min-h-screen relative overflow-x-hidden selection:bg-sky-500/30 selection:text-white">
    <div id="app" class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center"></div>
</body>

</html>
